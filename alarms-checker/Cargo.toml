[package]
name = "alarms-check"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Checks the OpenVIBES baseline alarm rule set (process_event rules) before it is signed and released"

# Pinned at the oldest agent that evaluates process_event rules (P14), not
# at the baseline's pin: the pinned compiler and evaluator are the
# allowlist of event keys and CEL subset v2 methods.
[dependencies]
openvibes-core = { git = "https://github.com/openvibes-project/openvibes-agent.git", rev = "8648be7281ddffc0d34b992b2c23d9901e33dca2" }
openvibes-rules = { git = "https://github.com/openvibes-project/openvibes-agent.git", rev = "8648be7281ddffc0d34b992b2c23d9901e33dca2" }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "0.11", default-features = false }
