# A tag vN: check the baseline, build the RPM, sign and check it, publish the
# GitHub Release, then tell the package repository to rebuild.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install build packages
        run: dnf -q -y install git cargo rust rpm-build rpm-sign rpmlint gnupg2 gh jq

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag is on main, above the last release, with the released key
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Only reviewed commits ship: a tag on a side commit could carry
          # rules or a key that main's CI never saw.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
          # The last release: the highest vN on main (a stray tag elsewhere
          # never counts).
          prev=$(git tag --merged origin/main -l 'v*' | grep -E '^v[0-9]+$' |
            grep -vx "$GITHUB_REF_NAME" | sort -V | tail -1 || true)
          if [ -n "$prev" ]; then
            [ "${GITHUB_REF_NAME#v}" -gt "${prev#v}" ] ||
              { echo "$GITHUB_REF_NAME is not above the last release $prev"; exit 1; }
            git diff --quiet "$prev" "$GITHUB_SHA" -- baseline/baseline.key ||
              { echo "baseline/baseline.key differs from $prev"; exit 1; }
          fi

      - name: The tag is the envelope version
        run: |
          version=$(jq -er .rule_set_version baseline/baseline.json)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, envelope v$version"; exit 1; }

      # No --previous-version here: the tag must equal the envelope version
      # (above), and main's CI already refused an envelope that did not move
      # past the last release.
      - name: Check the baseline
        run: >-
          cargo run --locked -p rules-check -- --dir baseline --cases tests/cases.json
          --allowlist facts.allowlist

      - name: Build the RPM
        run: bash scripts/build-rpm.sh dist

      - name: Sign and check
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: |
          bash scripts/sign-rpms.sh dist packaging/openvibes-packages.gpg
          (cd dist && sha256sum -- *.rpm > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "openvibes-rules $GITHUB_REF_NAME" --generate-notes dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
