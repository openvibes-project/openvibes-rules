sonar.projectKey=openvibes-project_openvibes-rules
sonar.organization=openvibes-project


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=openvibes-rules
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# tests/ holds test code and fixtures (release-test.sh, at-terminal.py,
# rule cases): analysed as tests, so the new-code coverage gate does not
# count it as product code.
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests
